name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build
      - run: dotnet test
      - name: Torneo de referencia (falla si hay errores, recursos negativos o fallos de jugador)
        run: dotnet run --project src/CortesIA.Evals -- 1000 1
